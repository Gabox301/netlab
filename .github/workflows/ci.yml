name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bunx biome check .
      - run: bun run --filter @netlab/web check

  # Fase 8 T1: puerta de regresión de rendimiento del motor. Los conteos
  # son deterministas (semilla 42); pared y RSS solo se reportan.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun install
      - name: Run engine benchmarks (small)
        run: |
          bun packages/cli/src/main.ts bench --size small --format human
          bun packages/cli/src/main.ts bench --size small --format json > bench.json
      - name: Assert positive events and bytes
        run: |
          bun -e '
            const fs = await import("node:fs/promises");
            const lines = (await fs.readFile("bench.json", "utf8")).trim().split("\n");
            if (lines.length !== 2) throw new Error(`expected 2 workloads, got ${lines.length}`);
            for (const line of lines) {
              const r = JSON.parse(line);
              if (!(r.events > 0)) throw new Error(`${r.workload}: events <= 0`);
              if (!(r.txBytes > 0)) throw new Error(`${r.workload}: txBytes <= 0`);
              if (!(r.eventsPerSec > 0)) throw new Error(`${r.workload}: eventsPerSec <= 0`);
            }
            console.log("bench gate ok:", lines.length, "workloads");
          '

  # S2 oracle for F-120 to F-122: a third-party dissector has to open the
  # captures the CLI writes, in both encodings. `bun test` pins the bytes and
  # the CLI behaviour everywhere; locally, without tshark, only that
  # structural half runs (bun test), so the expert/decode checks below are the
  # CI-only validation.
  pcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun install
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Generate captures with the CLI
        run: |
          set -euo pipefail
          echo "tshark is the S2 oracle here; without it locally, run bun test for the structural checks"
          # tshark en este runner devuelve EACCES con archivos 644 bajo
          # $GITHUB_WORKSPACE pero los abre bien en /tmp (probado en CI):
          # generar fuera del workspace.
          PCAP_DIR="$(mktemp -d)"
          echo "PCAP_DIR=$PCAP_DIR" >> "$GITHUB_ENV"
          bun packages/cli/src/main.ts pcap packages/cli/fixtures/dos-subredes.json -o "$PCAP_DIR/icmp.pcap" --until 100ms
          bun packages/cli/src/main.ts pcap packages/exercises/solutions/svc-dns-broken.json -o "$PCAP_DIR/dns.pcap" --until 100ms
          bun packages/cli/src/main.ts pcap packages/exercises/solutions/tcp-zero-window.json -o "$PCAP_DIR/tcp.pcap" --until 100ms
          # pcapng: one interface per link, and per-link selection (F-121, F-122).
          bun packages/cli/src/main.ts pcap packages/cli/fixtures/dos-subredes.json -o "$PCAP_DIR/icmp.pcapng" --until 100ms --format pcapng
          bun packages/cli/src/main.ts pcap packages/cli/fixtures/dos-subredes.json -o "$PCAP_DIR/icmp-l1.pcapng" --until 100ms --format pcapng --link l1
          ls -la "$PCAP_DIR/"
          for f in "$PCAP_DIR"/icmp.pcap "$PCAP_DIR"/dns.pcap "$PCAP_DIR"/tcp.pcap "$PCAP_DIR"/icmp.pcapng "$PCAP_DIR"/icmp-l1.pcapng; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
            test -r "$f" || { echo "::error::unreadable $f"; exit 1; }
          done
      - name: tshark opens every capture without errors or checksum warnings
        run: |
          status=0
          for f in "$PCAP_DIR"/*.pcap "$PCAP_DIR"/*.pcapng; do
            echo "::group::tshark -r $f -q -z expert"
            tshark -r "$f" -q -z expert || status=1
            echo "::endgroup::"
            # Malformed frames and checksum mismatches are the S2 failures. A
            # TCP "retransmission" warning is expected and allowed: a capture
            # of the whole network records each transmission once per link,
            # and that is what the simulation sees (pcapng labels each link as
            # its own interface; F-122). Likewise, ICMP *error messages*
            # ("Type indicates an error", Time Exceeded from traceroute,
            # Destination Unreachable, ...) are legitimate simulated traffic:
            # the exercises exercise them on purpose. Only real expert
            # errors (malformed frames, bad checksums, other "error" text)
            # fail the gate.
            expert=$(tshark -r "$f" \
              -o ip.check_checksum:true \
              -o tcp.check_checksum:true \
              -o udp.check_checksum:true \
              -T fields -e frame.number -e _ws.expert.message)
            bad=$(printf '%s\n' "$expert" | grep -iE 'malformed|checksum' || true)
            errs=$(printf '%s\n' "$expert" | grep -i 'error' | grep -vi 'indicates an error' || true)
            if [ -n "$bad$errs" ]; then
              echo "::error::$f has expert errors or checksum warnings"
              printf '%s\n' "$expert" | grep -iE 'malformed|checksum|error'
              status=1
            fi
          done
          exit $status
      - name: tshark decodes the DNS, TCP and ICMP traffic
        run: |
          set -euo pipefail
          dns=$(tshark -r "$PCAP_DIR"/dns.pcap -Y dns -T fields -e dns.qry.name)
          echo "DNS query names:"
          echo "$dns"
          echo "$dns" | grep -qx "web.lab"
          syn=$(tshark -r "$PCAP_DIR"/tcp.pcap \
            -Y 'tcp.flags.syn == 1 && tcp.flags.ack == 0' \
            -T fields -e tcp.dstport | sort -u)
          echo "TCP SYN destination ports:"
          echo "$syn"
          echo "$syn" | grep -qx "80"
          icmp=$(tshark -r "$PCAP_DIR"/icmp.pcap -Y icmp -T fields -e frame.number | wc -l)
          echo "ICMP packets: $icmp"
          test "$icmp" -gt 0
          # pcapng keeps the same traffic and labels the links as interfaces.
          ng=$(tshark -r "$PCAP_DIR"/icmp.pcapng -Y icmp -T fields -e frame.number | wc -l)
          echo "ICMP packets (pcapng): $ng"
          test "$ng" -ge "$icmp"
          ifaces=$(tshark -r "$PCAP_DIR"/icmp.pcapng -T fields -e frame.interface_id | sort -u | wc -l)
          echo "pcapng interfaces: $ifaces"
          test "$ifaces" -ge 2
          # --link captured one interface only, and only its frames.
          one=$(tshark -r "$PCAP_DIR"/icmp-l1.pcapng -T fields -e frame.interface_id | sort -u | wc -l)
          echo "selected interfaces: $one"
          test "$one" -eq 1
