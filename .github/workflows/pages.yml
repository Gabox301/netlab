name: pages

# Fase 8 T5: demo pública de NetLab en GitHub Pages.
# La simulación corre en un Web Worker, así que el sitio es 100 % estático: no
# hay backend ni WebSocket, solo archivos. El prefijo desde el que se sirve
# entra por BASE_PATH y lo consume packages/web/vite.config.ts (plugin
# sveltekit); vacío significa raíz.
#
# Receta oficial de Pages: `actions/configure-pages` lee la configuración del
# sitio y publica `base_path`, así que el prefijo lo resuelve la action (sirve
# igual para un project site `/repo` que para `<owner>.github.io`, que va sin
# prefijo) y no una regla propia del workflow. Requiere que Pages esté
# habilitado con Source = GitHub Actions (ver docs/demo.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez, y sin cancelar el que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Resolve base path
        id: pages
        uses: actions/configure-pages@v6

      - run: bun install

      - name: Build static UI
        working-directory: packages/web
        run: bun run build
        env:
          # `/Net-Lab` en un project site, vacío en `<owner>.github.io` (o con
          # dominio propio). vite.config.ts normaliza ambos casos.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Smoke del artefacto: las cinco rutas prerenderizadas, el fallback
      # `404.html` y el chunk del worker existen. Si BASE_PATH rompiera el
      # build, esto falla antes de publicar. Además es la puerta que ahora
      # garantiza el prerender total: pasar `fallback` a adapter-static
      # desactiva su chequeo de rutas dinámicas, así que la cobertura de rutas
      # se verifica acá.
      - name: Verify static output
        working-directory: packages/web
        run: |
          set -euo pipefail
          build=build
          for page in index workbench teoria practica editor; do
            test -f "$build/$page.html"
          done
          test -f "$build/404.html"
          ls "$build"/_app/immutable/workers/sim.worker-*.js > /dev/null
          # Defensivo: si el sitio se procesara como Jekyll, `_app` se
          # ignoraría por empezar con guion bajo.
          : > "$build/.nojekyll"
          echo "static build ok: $(find "$build" -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/build
          # `.nojekyll` es un archivo oculto y el artefacto los ignora por
          # default: sin esto no llega a Pages.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
